apiVersion: hanzo.ai/v1
kind: Service
metadata:
  name: market
  namespace: hanzo
spec:
  component: market
  partOf: platform
  replicas: 1
  strategy: Recreate
  # base runs as uid 100 / gid 101 (non-root "hanzo" user). Without fsGroup the
  # root-owned PVC opens read-only → SQLite "attempt to write a readonly
  # database (8)". Chown the persistence volume to base's gid so it can write.
  fsGroup: 101
  image:
    repository: ghcr.io/hanzoai/market
    tag: "0.2.4"
    pullPolicy: Always
  imagePullSecrets:
    - name: ghcr-secret
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3001"
    - name: WEB_PORT
      value: "3000"
    - name: BASE_URL
      value: "http://127.0.0.1:8090"
    - name: IAM_URL
      value: "https://hanzo.id"
    - name: PUBLIC_URL
      value: "https://hub.hanzo.bot"
    - name: API_URL
      value: "https://hub.hanzo.bot/api"
    - name: IAM_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: hanzo-bothub-iam-creds
          key: clientId
    - name: IAM_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: hanzo-bothub-iam-creds
          key: clientSecret
    - name: S3_ENDPOINT
      value: "http://minio.hanzo.svc:9000"
    - name: S3_BUCKET
      value: "market-files"
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: market-secrets
          key: OPENAI_API_KEY
          optional: true
  ports:
    - name: web
      containerPort: 3000
      servicePort: 3000
    - name: api
      containerPort: 3001
      servicePort: 3001
  ingress:
    enabled: true
    ingressClassName: ingress
    clusterIssuer: letsencrypt-prod
    tls: true
    hosts:
      - hub.hanzo.bot
    # market is two processes: Hono API on 3001, TanStack/Nitro web on 3000.
    # /api and /health go to the API; everything else to the web SSR server.
    pathRules:
      - path: /api
        pathType: Prefix
        port: 3001
      - path: /health
        pathType: Prefix
        port: 3001
      - path: /
        pathType: Prefix
        port: 3000
  readinessProbe:
    path: /health
    port: 3001
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    path: /health
    port: 3001
    initialDelaySeconds: 20
    periodSeconds: 30
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Hanzo Base runs as a loopback sidecar (IAM-native, pure client). The app
  # authenticates to it as a service principal via IAM client_credentials.
  sidecars:
    - name: base
      # json/v1 build. base >=1.3.1 sets GOEXPERIMENT=jsonv2, under which
      # core.Collection.UnmarshalJSON's `type alias *Collection` recursion-guard
      # no longer strips the method → infinite recursion (stack overflow) when a
      # JS migration creates a collection. 1.3.0 is the last json/v1 tag.
      image: ghcr.io/hanzoai/base:1.3.0
      imagePullPolicy: Always
      # NOTE: --automigrate + --migrationsDir intentionally omitted. The
      # hub_collections.js migration uses the pre-v0.23 PocketBase field format
      # (options:{maxSize/values/collectionId}) and a `users` collection that
      # collides with base's provisioned auth collection, so base exits
      # non-zero applying it in-cluster. Rewriting that migration to base's
      # inline field schema is tracked as remaining market#6 work; until then
      # base boots clean as the IAM-native sidecar (no hub collections yet).
      args:
        - "serve"
        - "--http=127.0.0.1:8090"
        - "--dir=/app/hz_data"
      env:
        - name: IAM_URL
          value: "https://hanzo.id"
        - name: KMS_URL
          value: "http://kms.hanzo.svc"
        - name: IAM_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: hanzo-bothub-iam-creds
              key: clientId
        - name: IAM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hanzo-bothub-iam-creds
              key: clientSecret
        - name: PRINCIPAL_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: market-secrets
              key: PRINCIPAL_ENCRYPTION_KEY
      volumeMounts:
        - name: base-data
          mountPath: /app/hz_data
        # hz-migrations ConfigMap intentionally NOT mounted: base's default
        # migrations dir is /app/hz_migrations and it auto-migrates on boot, so
        # mounting the (schema-incompatible) hub_collections.js makes base exit
        # non-zero. Left unmounted until the migration is ported to base's
        # inline field schema.
        - name: base-tmp
          mountPath: /tmp
  volumeMounts:
    - name: market-tmp
      mountPath: /tmp
  volumes:
    - name: base-data
      persistentVolumeClaim:
        claimName: market-base-data
    - name: base-tmp
      emptyDir: {}
    - name: market-tmp
      emptyDir: {}
