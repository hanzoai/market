# Canonical Hanzo ingress: Traefik IngressRoute (hanzoai/ingress).
# Never nginx, never caddy. Routes hub.hanzo.bot to the market service:
# /api/* and /health → API (3001), everything else → web (80).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hub-hanzo-bot
  namespace: hanzo
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`hub.hanzo.bot`) && (PathPrefix(`/api`) || Path(`/health`))
      priority: 20
      services:
        - name: market
          port: 3001
    - kind: Rule
      match: Host(`hub.hanzo.bot`)
      priority: 10
      services:
        - name: market
          port: 80
  tls:
    secretName: hub-hanzo-bot-tls
