apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-ingress
  namespace: market
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    # Route /api/* to API port, everything else to web port
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hanzo.market
      secretName: hanzo-market-tls
  rules:
    - host: hanzo.market
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: market
                port:
                  number: 3001
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: market
                port:
                  number: 3001
          - path: /health
            pathType: Exact
            backend:
              service:
                name: market
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: market
                port:
                  number: 80
