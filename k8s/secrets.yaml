# Canonical secret source: Hanzo KMS, synced into the market-secrets Secret
# by the KMS operator. Secrets NEVER live in git in plaintext.
#
# The KMS path /market (project hanzo, env prod) holds:
#   PRINCIPAL_ENCRYPTION_KEY  — Base per-principal DEK master key (required)
#   S3_ACCESS_KEY / S3_SECRET_KEY — object storage (optional; gates uploads)
#   OPENAI_API_KEY            — embeddings (optional; gates semantic search)
#
# IAM application credentials (clientId/clientSecret) are NOT duplicated here:
# both containers read them from the existing hanzo-bothub-iam-creds Secret.
apiVersion: secrets.lux.network/v1alpha1
kind: KMSSecret
metadata:
  name: market-kms-sync
  namespace: hanzo
spec:
  hostAPI: http://kms.hanzo.svc
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: hanzo-bothub-iam-creds
        secretNamespace: hanzo
      secretsScope:
        projectSlug: hanzo
        envSlug: prod
        secretsPath: /market
        keys:
          - PRINCIPAL_ENCRYPTION_KEY
          - S3_ACCESS_KEY
          - S3_SECRET_KEY
          - OPENAI_API_KEY
  managedSecretReference:
    secretName: market-secrets
    secretNamespace: hanzo
    secretType: Opaque
    creationPolicy: Orphan
