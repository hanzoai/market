name: Container Images CD

# One-way pipeline: a v* git tag builds a SEMVER image on the hanzoai ARC pool
# (in-cluster amd64 runners). No GitHub-hosted runners, no :latest, no auto
# kubectl (the hub currently lives in namespace `hanzo` behind hub.hanzo.bot,
# not the repo-manifest namespace — deploys are done by pinning the tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    if: github.repository == 'hanzoai/market'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/market
      platforms: linux/amd64
      # ARC v2 routes by scale-set NAME, not labels — pin the hanzoai amd64 pool
      # (cross-org runs-on queues forever).
      runner-amd64: '["hanzo-build-linux-amd64"]'
      runner-deploy: '["hanzo-build-linux-amd64"]'
    secrets: inherit
