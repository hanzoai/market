# hanzoai/market — hanzo.market, the Hanzo marketplace: a static storefront on the
# sites plane over api.hanzo.ai. No server and no image: the build is dist/, and
# the site lane publishes it to s3://hanzo-sites/hanzo/hanzo-market, which the
# edge serves for hanzo.market (hanzoai/universe infra/aws/routes/sites.yaml).
#
# Read by hanzoai/ci's build.yml (.github/workflows/cicd.yml is the caller).

test:
  - name: gate
    # Cheapest first: lint (oxlint type-aware + the Hanzo design lint), types,
    # unit tests under the coverage threshold, then the build — and the build is
    # checked for the two documents the sites plane serves, because a vite build
    # that emits nothing still exits 0.
    run: |
      set -e
      command -v bun >/dev/null 2>&1 || curl -fsSL https://bun.sh/install | bash
      export PATH="$HOME/.bun/bin:$PATH"
      bun install --frozen-lockfile
      bun run lint
      bun run typecheck
      bun run coverage
      bun run build
      test -s dist/index.html
      test -s dist/404.html

site:
  slug: hanzo-market
  dir: dist
  build: command -v bun >/dev/null 2>&1 || curl -fsSL https://bun.sh/install | bash; export PATH="$HOME/.bun/bin:$PATH"; bun install --frozen-lockfile && bun run build
  on: [main]
